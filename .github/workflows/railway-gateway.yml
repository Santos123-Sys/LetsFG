name: Railway MCP Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile.railway"
      - ".dockerignore"
      - "deploy/**"
      - "sdk/mcp/**"
      - ".github/workflows/railway-gateway.yml"
  push:
    branches: [deploy/railway-readonly-mcp-gateway]
    paths:
      - "Dockerfile.railway"
      - ".dockerignore"
      - "deploy/**"
      - "sdk/mcp/**"
      - ".github/workflows/railway-gateway.yml"

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Gateway security and protocol tests
        run: node --test deploy/railway-gateway.test.cjs
      - name: Install MCP build dependencies
        run: npm ci --prefix sdk/mcp --no-audit --no-fund
      - name: Build the source MCP server
        run: npm run build --prefix sdk/mcp
      - name: Build the exact Railway image
        run: docker build --file Dockerfile.railway --tag letsfg-railway:ci .
